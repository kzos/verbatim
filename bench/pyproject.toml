[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "verbatim-bench"
version = "0.0.1.dev0"
description = "The Verbatim measurement harness: paced load generator, results rows, invariance gate"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Zaheer Sheriff K", email = "zaheersheriff.k@gmail.com" }]

# NO dependency on `verbatim`. The harness, the rows, the corpora and the
# invariance gate must survive the server being de-scoped.
# `verbatim-bench verify|validate|replay` are torch-free so a laptop can
# recompute a published artifact.
dependencies = [
  "numpy>=1.26",
  "websockets>=15,<18",
  "soundfile>=0.12.1",
]

[project.optional-dependencies]
# Only arm (b) and the batch-1 reference run need a model runtime.
reference = [
  "nemo-toolkit[asr]>=3.0,<4",
  "torch>=2.8",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
verbatim-bench = "verbatim_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/verbatim_bench"]
